<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<title>SQL 測驗系統（完整題庫 69 題）</title>
<style>
body{
  font-family:"Segoe UI","Microsoft JhengHei",sans-serif;
  margin:0;
  background:#0f172a;
  color:#f1f5f9;
  display:flex;
  justify-content:center;
  padding:40px 10px;
}
.quiz-box{
  width:900px;
  background:#1e293b;
  border-radius:12px;
  padding:35px;
  box-shadow:0 0 25px rgba(0,0,0,0.5);
}
#startScreen{text-align:center;}
#startScreen h1{
  font-size:36px;
  margin-bottom:12px;
  color:#60a5fa;
}
#startScreen p{
  line-height:1.7;
}
button{
  font-family:inherit;
}
#startBtn{
  background:#3b82f6;
  color:white;
  padding:15px 40px;
  border-radius:8px;
  border:none;
  font-size:20px;
  cursor:pointer;
  transition:0.25s;
  margin-top:20px;
}
#startBtn:hover{transform:scale(1.06);background:#60a5fa;}
#timer,#progress{
  font-size:18px;
  background:#0c4a6e;
  padding:10px 14px;
  border-radius:6px;
  margin-bottom:12px;
  width:fit-content;
}
#quizScreen{margin-top:10px;}
.question{
  font-size:20px;
  font-weight:bold;
  margin:18px 0;
  line-height:1.6;
}
.choices label{
  display:block;
  padding:12px 14px;
  background:#334155;
  margin-bottom:10px;
  border-radius:8px;
  cursor:pointer;
  transition:0.22s;
  border:2px solid transparent;
}
.choices label:hover{
  background:#475569;
  border-color:#60a5fa;
}
.choices input{
  margin-right:6px;
}
#nextBtn,#restartBtn{
  padding:12px 28px;
  font-size:18px;
  border-radius:6px;
  border:none;
  cursor:pointer;
  margin-top:18px;
  transition:0.25s;
}
#nextBtn{
  background:#2563eb;
  color:white;
}
#nextBtn:hover{transform:scale(1.06);background:#3b82f6;}
#restartBtn{
  background:#16a34a;
  color:black;
}
#restartBtn:hover{transform:scale(1.06);background:#22c55e;}
#scoreBox{
  margin-top:15px;
  font-size:28px;
  font-weight:bold;
  color:#38bdf8;
}
.result-list{
  margin-top:20px;
  background:#0f172a;
  border-radius:10px;
  padding:18px;
  border-left:6px solid #3b82f6;
  max-height:480px;
  overflow-y:auto;
}
.result-list p{
  line-height:1.6;
  margin-bottom:14px;
  color:#e2e8f0;
  font-size:15px;
}
.correctText{color:#22c55e;}
.wrongText{color:#f97373;}
</style>
</head>
<body>
<div class="quiz-box">

  <!-- 首頁 -->
  <div id="startScreen">
    <h1>SQL 測驗系統</h1>
    <p>
      本系統支援：隨機題序、隨機選項、計時、100 分制成績、對錯清單、重新測驗。<br/>
      題庫目前收錄：<strong>69 題</strong>（包含單選題與多選題）。<br/>
      按下「開始測驗」後，系統才會出題並開始計時。
    </p>
    <button id="startBtn" onclick="startQuiz()">開始測驗</button>
  </div>

  <!-- 測驗畫面 -->
  <div id="quizScreen">
    <div id="timer">時間：0 秒</div>
    <div id="progress">題目：0 / 0</div>
    <div class="question" id="questionText"></div>
    <div class="choices" id="choices"></div>
    <button id="nextBtn" onclick="handleNext()">下一題</button>
  </div>

  <!-- 結果畫面 -->
  <div id="resultScreen">
    <div id="scoreBox"><span id="finalScore"></span></div>
    <div class="result-list" id="detail"></div>
    <button id="restartBtn" onclick="restartQuiz()">重新測驗</button>
  </div>

</div>

<script>
// ===== 題庫（69 題，含單選與多選） =====
const questions = [
  // 1
  {
    id: 1,
    text: `您在某間咖啡廳工作，公司要求您設定網站來儲存購物費用。
您需要建議公司在資料庫資料表中使用某種資料類型，以便根據收費金額執行財務函數。
請問您應該使用哪一種資料類型？`,
    options: [
      "binary",
      "bit",
      "decimal",
      "varchar"
    ],
    correct: [2]
  },
  // 2
  {
    id: 2,
    text: `請問哪一個陳述式會建立複合鍵（Composite Key）？`,
    options: [
      "CREATE TABLE [Order] (OrderID INTEGER, OrderItemID INTEGER, PRIMARY KEY (OrderID, OrderItemID))",
      "CREATE TABLE [Order] (OrderID INTEGER PRIMARY KEY, OrderItemID INTEGER PRIMARY KEY)",
      "CREATE TABLE [Order] (OrderID INTEGER, OrderItemID INTEGER, PRIMARY KEY)",
      "CREATE TABLE [Order] (OrderID INTEGER, OrderItemID INTEGER, PRIMARY KEY OrderID, PRIMARY KEY OrderItemID)"
    ],
    correct: [0]
  },
  // 3
  {
    id: 3,
    text: `請問關聯式資料庫會使用哪一項功能來確保輸入資料行中的資料有效？`,
    options: [
      "屬性（Attribute）",
      "主索引鍵（Primary Key）",
      "條件約束（Constraint）",
      "索引（Index）"
    ],
    correct: [2]
  },
  // 4
  {
    id: 4,
    text: `對於下列每一項敘述，若［正確］為 O，［錯誤］為 X。  
1. 您可以使用預存程序來刪除資料。  
2. 函數必須具有傳回值。  
3. 預存程序必須具有傳回值。  
請問填入正確或錯誤符號順序為何？`,
    options: [
      "O、O、O",
      "O、X、O",
      "X、O、O",
      "O、O、X"
    ],
    correct: [1]
  },
  // 5
  {
    id: 5,
    text: `您有一個名為 Employee 的資料表，其中包含下列資料行：
EmployeeID、EmployeeName。  
請問您應該使用哪一個陳述式來傳回資料表中的資料列數目？`,
    options: [
      "SELECT COUNT(rows) FROM Employee",
      "SELECT COUNT(*) FROM Employee",
      "SELECT * FROM Employee",
      "SELECT SUM(*) FROM Employee"
    ],
    correct: [1]
  },
  // 6
  {
    id: 6,
    text: `您需要將兩個查詢的結果結合成單一結果，而且包含這兩個查詢中的所有資料列。
請問您應該使用哪一個 SQL 陳述式？`,
    options: [
      "EXCEPT",
      "JOIN",
      "TRUNCATE",
      "UNION"
    ],
    correct: [3]
  },
  // 7
  {
    id: 7,
    text: `Orders(orderID, Country)。
請問哪一個 SQL 陳述式會傳回：每個國家地區訂單數目少於 50 的國家以及其訂單數目？`,
    options: [
      "SELECT COUNT(orderID), Country FROM Orders GROUP BY Country HAVING COUNT(orderID) < 50;",
      "SELECT COUNT(orderID), Country FROM Orders HAVING COUNT(orderID) < 50 GROUP BY Country;",
      "SELECT Country, orderID FROM Orders GROUP BY Country WHERE COUNT(orderID) < 50;",
      "SELECT Country, orderID FROM Orders WHERE COUNT(orderID) < 50 GROUP BY Country;"
    ],
    correct: [0]
  },
  // 8
  {
    id: 8,
    text: `您刪除了 order 資料表中的資料列，orderItem 資料表中的對應資料列也被自動刪除了。
這是下列其中一種程序的範例：`,
    options: [
      "串聯刪除（Cascade Delete）",
      "骨牌法刪除（Domino Delete）",
      "函數法刪除（Functional Delete）",
      "瀑布法刪除（Waterfall Delete）"
    ],
    correct: [0]
  },
  // 9
  {
    id: 9,
    text: `您正在撰寫一個 SELECT 陳述式找出名稱包含特定字元的所有產品。
請問您應該在 WHERE 子句中使用哪一個關鍵字？`,
    options: [
      "LIKE",
      "FETCH",
      "BETWEEN",
      "IN"
    ],
    correct: [0]
  },
  // 10
  {
    id: 10,
    text: `Products 資料表包含 ItemNumber、ItemName、ItemDescription、Price。
請問哪一個查詢會將商品 1 的價格提高 6%？`,
    options: [
      "UPDATE Products SET Price = Price * 1.06 WHERE ItemNumber = 1;",
      "ALTER Products SET Price = Price * 1.06 WHERE ItemNumber = 1;",
      "USE Products SET Price = Price * 1.06 WHERE ItemNumber = 1;",
      "SET Price FROM Products = Price * 1.06 WHERE ItemNumber = 1;"
    ],
    correct: [0]
  },
  // 11
  {
    id: 11,
    text: `請問哪一個 SQL 陳述式是資料操作語言（DML）陳述式？`,
    options: [
      "SELECT * INTO Employee FROM NewHires",
      "INSERT INTO Employee VALUES ('Jack Smith');",
      "ALTER TABLE Employee ADD EmployeeName VARCHAR(50);",
      "SELECT EmployeeName FROM Employee WHERE EmployeeName = 'Jack Smith';"
    ],
    correct: [1]
  },
  // 12
  {
    id: 12,
    text: `您有兩個資料表，每個資料表都有三個資料列。
您建立了一個使用交叉聯結（CROSS JOIN）的 SQL 查詢，這個查詢不包含 WHERE 子句。
請問這兩個資料表的笛卡兒乘積會包含多少個資料列？`,
    options: [
      "0",
      "3",
      "6",
      "9"
    ],
    correct: [3]
  },
  // 13
  {
    id: 13,
    text: `建立預存程序（Stored Procedure）的其中一個主要原因是：`,
    options: [
      "提升效能",
      "將儲存空間最小化",
      "略過區分大小寫需求",
      "讓使用者能夠直接控制查詢邏輯"
    ],
    correct: [0]
  },
  // 14
  {
    id: 14,
    text: `請問您應該使用哪一個陳述式來移除外部索引鍵（Foreign Key）？`,
    options: [
      "ALTER TABLE",
      "DELETE TABLE",
      "ALTER FOREIGN KEY",
      "DELETE FOREIGN KEY"
    ],
    correct: [0]
  },
  // 15
  {
    id: 15,
    text: `Volunteer 資料表：ID、GivenName，目前有 Tia、Susana、Joey。
當志工資訊變更時必須更新資料表。您需要將 Tia 的名字變更為 Kimberly。
請問您應該選擇哪一個陳述式？`,
    options: [
      "UPDATE Volunteer SET GivenName = 'Kimberly' WHERE GivenName = 'Tia';",
      "UPDATE GivenName = 'Kimberly' FROM Volunteer WHERE GivenName = 'Tia';",
      "SET GivenName = 'Kimberly' FROM Volunteer WHERE GivenName = 'Tia';",
      "SET Volunteer WHERE GivenName = 'Tia';"
    ],
    correct: [0]
  },
  // 16
  {
    id: 16,
    text: `您正在設定關聯式資料庫中某個資料表的結構。
對於下列每一項敘述，若［正確］為 O，［錯誤］為 X。  
1. 資料表中欄位的每個值都必須是唯一的。  
2. 資料表中的每個資料列都必須是唯一的。  
3. 資料表中的每個資料行名稱都必須是唯一的。  
請問填入正確或錯誤符號順序為何？`,
    options: [
      "O、O、O",
      "O、X、O",
      "X、O、O",
      "O、O、X"
    ],
    correct: [2]
  },
  // 17
  {
    id: 17,
    text: `您有一個名為 Product 的資料表。您建立了一個檢視表，其中包含 Product 中屬於 Furniture 類別的所有產品。
您針對 Product 資料表執行一個陳述式來刪除屬於 Furniture 類別的所有產品。
在您執行該陳述式之後，檢視表的結果集將：`,
    options: [
      "被封存",
      "被刪除（檢視表物件被移除）",
      "清空（仍存在，但沒有任何資料列）",
      "保持不變"
    ],
    correct: [2]
  },
  // 18
  {
    id: 18,
    text: `您需要停用 User1 檢視 Customer 資料的存取權。
請問您應該使用哪一個陳述式？`,
    options: [
      "REMOVE User1 FROM Customer",
      "REVOKE User1 FROM Customer",
      "REMOVE SELECT ON Customer FROM User1",
      "REVOKE SELECT ON Customer FROM User1"
    ],
    correct: [3]
  },
  // 19  (原題為多選，本系統採「多選題」作答)
  {
    id: 19,
    text: `您正在開發一個 SQL 陳述式以建立資料表。
請問哪兩個 SQL 關鍵字可用於 CREATE TABLE 陳述式？（請選擇 2 個答案）`,
    options: [
      "ORDER BY",
      "CONSTRAINT",
      "PRIMARY KEY",
      "INSERT INTO"
    ],
    correct: [1,2]
  },
  // 20  多選
  {
    id: 20,
    text: `您需要將資料庫正規化為「第一正規形式（1NF）」。
請問您必須符合哪兩項需求？（請選擇 2 個答案）`,
    options: [
      "排除複合索引鍵",
      "排除重複資料列",
      "排除外部索引鍵",
      "排除重複群組（Repeating Groups）"
    ],
    correct: [1,3]
  },
  // 21
  {
    id: 21,
    text: `有一個預存程序包含以下查詢：
SELECT 'Greetings' + Prefix + ' ' + FirstName FROM Person;
此預存程序會傳回所有 NULL 值。您確認 Person 資料表包含資料。
請問這個問題的最可能原因為何？`,
    options: [
      "Prefix 或 FirstName 資料行具有 NULL 值。",
      "必須在查詢中指定 NULLIF 關鍵字。",
      "加號（+）運算子無法用來附加字元資料。",
      "必須在 SELECT 陳述式中指定 JOIN 關鍵字。"
    ],
    correct: [0]
  },
  // 22  多選
  {
    id: 22,
    text: `AddressInfo 資料表結構如下：  
StreetAddress varchar(255)、City varchar(255)、State varchar(2)、PostalCode varchar(15)，允許 NULL。  
您必須插入一筆記錄：'1234 Main Street', 'Dallas', 'TX', '75201'。  
請問您可以使用哪兩個 SQL 陳述式？（請選擇 2 個答案）`,
    options: [
      "INSERT INTO AddressInfo VALUES ('1234 Main Street', 'Dallas', 'TX', '75201');",
      "INSERT INTO AddressInfo ('1234 Main Street', 'Dallas', 'TX', '75201') VALUES ([StreetAddress], [City], [State], [PostalCode]);",
      "INSERT INTO AddressInfo ([StreetAddress], [City], [State], [PostalCode]) VALUES ('1234 Main Street', 'Dallas', 'TX', '75201');",
      "UPDATE AddressInfo SET [StreetAddress] = '1234 Main Street', [City] = 'Dallas', [State] = 'TX', [PostalCode] = '75201';"
    ],
    correct: [0,2]
  },
  // 23
  {
    id: 23,
    text: `請問哪一個關鍵字會結合兩個查詢的結果，並且僅傳回兩個結果集都有出現的資料列？`,
    options: [
      "UNION",
      "INTERSECT",
      "ALL",
      "JOIN"
    ],
    correct: [1]
  },
  // 24
  {
    id: 24,
    text: `您需要使用 Employee 資料表中的所有資料填入名為 EmployeeCopy 的資料表。
請問您應該使用哪一個陳述式？`,
    options: [
      "COPY * INTO EmployeeCopy SELECT * FROM Employee;",
      "INSERT INTO EmployeeCopy SELECT * FROM Employee;",
      "INSERT * FROM Employee INTO EmployeeCopy;",
      "SELECT * INTO EmployeeCopy SELECT * FROM Employee;"
    ],
    correct: [1]
  },
  // 25
  {
    id: 25,
    text: `函數（Function）與預存程序（Stored Procedure）之間的其中一項差異在於，函數：`,
    options: [
      "必須有傳回值。",
      "無法接受參數。",
      "無法包含交易。",
      "必須由觸發程序呼叫。"
    ],
    correct: [0]
  },
  // 26
  {
    id: 26,
    text: `您有一個名為 Customer 的資料表，需要建立一個名為 District 的新整數欄位。
請問您應該使用哪一個陳述式？`,
    options: [
      "ALTER TABLE Customer ADD (INTEGER District);",
      "ALTER TABLE Customer ADD (District INTEGER);",
      "MODIFY TABLE Customer ADD (INTEGER District);",
      "ALTER TABLE Customer MODIFY (District INTEGER);"
    ],
    correct: [1]
  },
  // 27
  {
    id: 27,
    text: `您的資料庫包含一個名為 Customer 的資料表。您需要從 Customer 資料表中刪除 CustomerID 為 12345 的記錄。
請問您應該使用哪一個陳述式？`,
    options: [
      "DELETE FROM Customer WHERE CustomerID = 12345;",
      "DELETE CustomerID FROM Customer WHERE CustomerID = 12345;",
      "UPDATE Customer DELETE * WHERE CustomerID = 12345;",
      "UPDATE CustomerID FROM Customer DELETE * WHERE CustomerID = 12345;"
    ],
    correct: [0]
  },
  // 28
  {
    id: 28,
    text: `LoanedBooks 資料表：  
ID, Name, City, Books  
其中舊金山（San Francisco）的 Harry 歸還了書籍。  
請問哪一個陳述式可正確更新您的資料表？`,
    options: [
      "UPDATE LoanedBooks SET Books = 0 WHERE (Name = 'Harry' OR City = 'San Francisco');",
      "UPDATE LoanedBooks SET Books = 0 WHERE (Name IN ('Harry','San Francisco'));",
      "UPDATE LoanedBooks SET Books = 0 WHERE (Name = 'Harry' AND City = 'San Francisco');",
      "INSERT INTO LoanedBooks SET Books = 0 WHERE ID = 4;"
    ],
    correct: [2]
  },
  // 29
  {
    id: 29,
    text: `您的資料庫有一個 Department 資料表以及一個 Employee 資料表。
您需要確保一位員工只能被借派到一個「現有的」部門。
請問您應該對 Employee 資料表套用什麼？`,
    options: [
      "資料類型（Data Type）",
      "外部索引鍵（Foreign Key）",
      "索引（Index）",
      "主索引鍵（Primary Key）",
      "唯一條件約束（UNIQUE Constraint）"
    ],
    correct: [1]
  },
  // 30
  {
    id: 30,
    text: `您有一個名為 Student 的資料表，其中包含 100 個資料列。
部分資料列 FirstName 資料行具有 NULL 值。您執行了：
DELETE FROM Student;
請問結果為何？`,
    options: [
      "您會收到錯誤訊息。",
      "系統將刪除資料表中的所有資料列。",
      "系統將刪除所有資料列和資料表定義。",
      "系統將只刪除 FirstName 資料行含有 NULL 值的資料列。"
    ],
    correct: [1]
  },
  // 31
  {
    id: 31,
    text: `請問哪一個陳述式會建立索引？`,
    options: [
      "CREATE TABLE Employee (EmployeeID INTEGER PRIMARY KEY);",
      "CREATE TABLE Employee (EmployeeID INTEGER INDEX);",
      "CREATE TABLE Employee (EmployeeID INTEGER NULL);",
      "CREATE TABLE Employee (EmployeeID INTEGER DISTINCT);"
    ],
    correct: [0]
  },
  // 32
  {
    id: 32,
    text: `一位開發人員嘗試使用下列查詢，在 Person 資料表中新增一個名為 Prefix 的資料行：
ALTER TABLE Person ADD Prefix varchar(4) NOT NULL;
執行後收到錯誤訊息。請問這個問題的可能原因為何？`,
    options: [
      "應該使用 DEFAULT 關鍵字來指定預設值。",
      "varchar(4) 資料類型不適用於 Person 資料表。",
      "應該先執行 DROP CONSTRAINT，再執行 ALTER TABLE。",
      "Person 資料表是空的。"
    ],
    correct: [0]
  },
  // 33
  {
    id: 33,
    text: `Road 資料表定義：  
CREATE TABLE Road (RoadID INTEGER NOT NULL, Distance INTEGER NOT NULL);  
目前資料： (1234,22)、(1384,34)。  
您執行：INSERT INTO Road VALUES (1234,36);  
假設尚未定義任何主鍵或唯一約束，請問結果為何？`,
    options: [
      "語法錯誤。",
      "資料表中的新資料列會被新增。",
      "發生錯誤，指出不允許 NULL 值。",
      "發生錯誤，指出不允許重複的 ID。"
    ],
    correct: [1]
  },
  // 34
  {
    id: 34,
    text: `請問哪一個陳述式會從資料表中移除所有資料列，但不記錄個別資料列刪除動作？`,
    options: [
      "ALTER TABLE",
      "DROP TABLE",
      "TRUNCATE TABLE",
      "CREATE TABLE"
    ],
    correct: [2]
  },
  // 35
  {
    id: 35,
    text: `請問哪一個查詢會傳回「除了加州（CA）以外」，其他所有在 2017-01-01 之後提交之訂單的結果集？`,

  {
    id: 69,
    text: `對於下列每一項敘述，若［正確］為 O，［錯誤］為 X。  
1. 完整資料庫備份就是整個資料庫中所有資料的複本。  
2. 交易紀錄備份會備份資料庫中的所有資料。  
3. 差異備份只會複製上次完整備份之前變更的資料。  
4. 檔案或檔案群組還原會指定要復原的資料庫部分。  
請問填入正確或錯誤符號順序為何？`,
    options: [
      "O、O、O、O",
      "O、X、X、O",
      "X、O、O、X",
      "O、O、X、O"
    ],
    correct: [1]
  }
];

// ===== 狀態變數 =====
let shuffledQuestions = [];
let currentIndex = 0;
let score = 0;
let startTime = 0;
let timerInterval = null;
let userAnswers = [];

// 初始：隱藏測驗＆結果＆計時器
window.onload = () => {
  document.getElementById("quizScreen").style.display = "none";
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("timer").style.display = "none";
  document.getElementById("progress").style.display = "none";
};

// ======================= 開始測驗 =======================
function startQuiz(){
  shuffledQuestions = [...questions].sort(() => Math.random() - 0.5);
  currentIndex = 0;
  score = 0;
  userAnswers = [];

  document.getElementById("startScreen").style.display = "none";
  document.getElementById("quizScreen").style.display = "block";
  document.getElementById("resultScreen").style.display = "none";
  document.getElementById("timer").style.display = "inline-block";
  document.getElementById("progress").style.display = "inline-block";

  startTime = Date.now();
  if(timerInterval) clearInterval(timerInterval);
  timerInterval = setInterval(updateTimer, 1000);

  showQuestion();
}

function updateTimer(){
  const sec = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById("timer").textContent = `時間：${sec} 秒`;
}

// ======================= 顯示題目 =======================
function showQuestion(){
  const q = shuffledQuestions[currentIndex];
  const total = shuffledQuestions.length;
  const choiceBox = document.getElementById("choices");

  document.getElementById("progress").textContent =
  `題目：${currentIndex+1} / ${total}`;

  document.getElementById("questionText").textContent = q.text;
  choiceBox.innerHTML = "";

  // 選項打亂
  let order = q.options.map((_,i)=>i).sort(()=>Math.random()-0.5);
  let multi = q.correct.length>1;

  order.forEach(idx=>{
    let label=document.createElement("label");
    let input=document.createElement("input");
    input.type=multi?"checkbox":"radio";
    input.name="choice";
    input.value=idx.toString();

    label.appendChild(input);
    label.appendChild(document.createTextNode(" "+q.options[idx]));

    // ★ 點選後立即評分與顯示正解
    input.onclick = ()=> selectAnswer(idx,label);

    choiceBox.appendChild(label);
  });

  document.getElementById("nextBtn").disabled=true;
  document.getElementById("nextBtn").style.opacity="0.4";
  document.getElementById("nextBtn").textContent =
  (currentIndex===total-1)?"交卷":"下一題";
}

// ======================= 點選答案立即評分 =======================
function selectAnswer(selectIndex,label){
  const q=shuffledQuestions[currentIndex];
  const correctList=q.correct;
  const isCorrect=correctList.includes(selectIndex);
  if(isCorrect) score++;

  let labels=document.querySelectorAll("#choices label");
  labels.forEach(lb=>{
    let iv= parseInt(lb.querySelector("input").value);
    lb.classList.add( correctList.includes(iv) ? "correct" : "" );
  });

  label.classList.add(isCorrect?"correct":"wrong");

  // 禁止重選
  document.querySelectorAll("#choices input").forEach(i=>i.disabled=true);

  userAnswers.push({
    question:q,
    selected:[selectIndex],
    isCorrect:isCorrect
  });

  // 允許下一題
  let btn=document.getElementById("nextBtn");
  btn.disabled=false;
  btn.style.opacity="1";
  btn.onclick=()=>{
    currentIndex++;
    if(currentIndex<shuffledQuestions.length) showQuestion();
    else endQuiz();
  };
}

// ======================= 結束測驗 =======================
function endQuiz(){
  clearInterval(timerInterval);
  const used=Math.floor((Date.now()-startTime)/1000);
  const total=shuffledQuestions.length;
  const percent=((score/total)*100).toFixed(1);

  document.getElementById("quizScreen").style.display="none";
  document.getElementById("resultScreen").style.display="block";

  document.getElementById("finalScore").textContent=
  `得分：${percent} 分（${score} / ${total} 題）｜耗時 ${used} 秒`;

  let box=document.getElementById("detail");
  box.innerHTML="";

  userAnswers.forEach((ua,i)=>{
    let q=ua.question;
    let wrong=q.correct.map(i=>q.options[i]).join("；");
    let pick=ua.selected.map(i=>q.options[i]).join("；");

    let p=document.createElement("p");
    p.innerHTML=
    `第 ${i+1} 題：${q.text}<br>
    <span class="${ua.isCorrect?"correctText":"wrongText"}">你的答案：${pick}</span><br>
    <span class="correctText">正確答案：${wrong}</span>`;

    box.appendChild(p);
  });
}

// ======================= 重新開始 =======================
function restartQuiz(){
  document.getElementById("resultScreen").style.display="none";
  document.getElementById("startScreen").style.display="block";
  document.getElementById("timer").style.display="none";
  document.getElementById("progress").style.display="none";
}


</script>
</body>
</html>
